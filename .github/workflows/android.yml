name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK & Send to Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle
        shell: bash
        run: |
          set -e
          gradle --version

      - name: Generate debug keystore
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Send APK to Telegram
        shell: bash
        run: |
          # البحث عن ملف الـ APK الناتج
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)

          if [ -f "$APK_PATH" ]; then
            echo "Uploading $APK_PATH to Telegram..."
            curl -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F document=@"$APK_PATH" \
                 -F caption="✅ تم بناء التطبيق بنجاح!%0A📱 المشروع: ${{ github.repository }}" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          else
            echo "Error: APK file not found!"
            exit 1
          fi
