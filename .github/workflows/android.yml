name: Android CI Release

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      # البناء لنسخة الـ Release
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # إرسال الملف فوراً للبوت
      - name: Send APK to Telegram
        shell: bash
        run: |
          # العثور على ملف الـ APK الناتج (غالباً في مجلد release)
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          
          if [ -f "$APK_PATH" ]; then
            curl -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                 -F document=@"$APK_PATH" \
                 -F caption="🚀 تم بناء نسخة Release جديدة!" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          fi
